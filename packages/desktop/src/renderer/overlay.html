<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: http: https:" />
<title>面必过</title>
<link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- 左侧品牌色条：一眼区分「正常 / 等待 / 异常」 -->
    <div class="edge" id="edge"></div>

    <header class="bar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="13" height="13">
            <path d="M2 8.5l3.2 3.2L14 4.5" fill="none" stroke="currentColor"
                  stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="name">面必过</span>
      </div>
      <span class="dot" id="dot"></span>
      <span class="src" id="src">待机</span>
      <span class="sep"></span>
      <span class="lat" id="lat">—</span>
      <span class="grow"></span>
      <span class="mode" id="mode">穿透</span>
    </header>

    <main class="body" id="body">
      <div class="empty" id="empty">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M7 10h6M7 14h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="empty-main">浮窗已就位，等待对方提问</div>
        <div class="empty-keys">
          <kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>K</kbd> 设置　
          <kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>H</kbd> 显示/隐藏
        </div>
      </div>

      <section class="card" id="card" hidden>
        <div class="anchor" id="anchorRow">
          <span class="tag">锚点</span>
          <span id="anchor">—</span>
        </div>
        <ul class="points" id="points"></ul>
        <div class="caution" id="caution" hidden></div>
      </section>

      <div class="question" id="question" hidden></div>
    </main>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
