<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: http: https:" />
<title>面必过 · 声音采集</title>
<link rel="stylesheet" href="audio-capture.css" />
</head>
<body>
<div class="app">
  <header class="head">
    <div class="title-block">
      <div class="title">声音采集</div>
      <div class="sub">只听声音，不采画面</div>
    </div>
    <div class="badge" id="stateWrap"><span class="led" id="led"></span><span id="state">初始化…</span></div>
  </header>

  <div class="tracks">
    <div class="track">
      <div class="t-head"><span class="t-name">系统音频</span><span class="t-val" id="tracks">—</span></div>
      <div class="bars" id="barsLoop"></div>
    </div>
    <div class="track">
      <div class="t-head"><span class="t-name">麦克风</span><span class="t-val" id="mic">检测中…</span></div>
      <div class="bars" id="barsMic"></div>
    </div>
  </div>

  <div class="who-panel" id="whoPanel">
    <span class="who-label">当前判定</span>
    <span class="who-value" id="who">等待语音…</span>
  </div>

  <div class="metrics">
    <div class="m"><span class="m-k">采样率</span><span class="m-v" id="rate">—</span></div>
    <div class="m"><span class="m-k">回环帧</span><span class="m-v" id="frames">0</span></div>
    <div class="m"><span class="m-k">麦克风帧</span><span class="m-v" id="micFrames">0</span></div>
  </div>

  <div class="foot">
    <span id="probe">电平旁路：—</span>
    <span class="sep"></span>
    <span>视频轨拿到即停 · 不落盘</span>
  </div>
</div>
<script src="audio-capture.js"></script>
</body>
</html>
